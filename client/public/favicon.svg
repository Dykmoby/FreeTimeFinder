<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Free Time Finder">
  <!--
    The app's thesis in one mark: two people's free time (purple + teal),
    and the gold lens where they overlap — the "common free time" the app
    exists to find. Same colour language as the grid (.slot--common is gold).
  -->
  <defs>
    <linearGradient id="overlap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd803"/>
      <stop offset="1" stop-color="#ff8906"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="20" cy="16" r="8.5"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="8.5" fill="#0b0b16"/>
  <circle cx="12" cy="16" r="8.5" fill="#7f5af0"/>
  <circle cx="20" cy="16" r="8.5" fill="#2cb1bc"/>
  <circle cx="12" cy="16" r="8.5" fill="url(#overlap)" clip-path="url(#lens)"/>
</svg>
